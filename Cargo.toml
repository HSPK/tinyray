[workspace]
members = ["crates/tinyray-proto", "crates/tinyray-registry", "crates/tinyray-client"]
resolver = "2"

[workspace.package]
version = "0.15.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server-auto", "client-legacy", "tokio"] }
http-body-util = "0.1"
bytes = "1"
