[workspace]
members = [
    "crates/tinyray",
    "crates/tinyray-core",
    "crates/tinyray-membership",
    "crates/tinyray-proto",
    "crates/tinyray-registry",
    "crates/tinyray-client",
]
resolver = "2"

[workspace.package]
version = "0.18.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
rmp-serde = "1"
rmp = "0.8"
socket2 = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util"] }
async-trait = "0.1"
sha2 = "0.10"
rmpv = { version = "1", features = ["with-serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
