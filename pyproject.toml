[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "tinyray"
version = "0.1.0"
description = "A phone book and a roll call for heterogeneous ML fleets"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.maturin]
manifest-path = "crates/tinyray-client/Cargo.toml"
module-name = "tinyray._tinyray"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 100
