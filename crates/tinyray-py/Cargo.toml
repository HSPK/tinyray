[package]
name = "tinyray-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "PyO3 bindings exposing the tinyray Rust core to Python."

[lib]
name = "_tinyray"
crate-type = ["cdylib", "rlib"]

[dependencies]
tinyray-core.workspace = true
bytes.workspace = true
# NOTE: no abi3. The limited API omits Py_buffer before 3.11, and the buffer
# protocol is exactly how we hand Rust-owned result buffers to numpy without a
# copy. Version-specific wheels are a cheap price for that.
pyo3 = { version = "0.27", features = ["extension-module"] }
tinyray-runtime.workspace = true
tokio.workspace = true
parking_lot.workspace = true
